name: Deploy to EdgeOne

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_PATH: ""
      EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor Xiangan audio
        run: |
          mkdir -p public/audio
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -H 'Referer: https://suno.com/' \
            'https://cdn1.suno.ai/9699b383-feba-4acb-80af-38c15fe7dfd8.mp3' \
            -o public/audio/xiang-an.mp3
          test -s public/audio/xiang-an.mp3

      - name: Build static site
        run: npm run build:static

      - name: Rewrite Xiangan audio to same-origin asset
        run: |
          python - <<'PY'
          from pathlib import Path

          old = b'https://cdn1.suno.ai/9699b383-feba-4acb-80af-38c15fe7dfd8.mp3'
          new = b'/audio/xiang-an.mp3'
          changed = 0
          for path in Path('site').rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.json', '.css'}:
                  continue
              data = path.read_bytes()
              if old not in data:
                  continue
              path.write_bytes(data.replace(old, new))
              changed += 1
          print(f'rewritten files: {changed}; audio URL: {new.decode()}')
          if changed == 0:
              raise SystemExit('Suno audio URL was not found in the generated site')
          PY
          test -s site/audio/xiang-an.mp3

      - name: Deploy to EdgeOne
        run: npx --yes edgeone@1.6.28 makers deploy site --name gongkao-teacher-website --env production --area global --token "$EDGEONE_PAGES_API_TOKEN" --json
