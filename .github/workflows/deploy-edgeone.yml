name: Deploy to EdgeOne

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_PATH: ""
      EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # The script keeps audit strict while allowing only the time-limited dev-only braces advisory.
        run: node scripts/audit-dependencies.mjs

      - name: Verify Xiangan audio
        run: node scripts/vendor-home-audio.mjs

      - name: Verify source
        run: npm run verify

      - name: Build static site
        run: npm run build:static

      - name: Verify same-origin audio asset
        run: test -s site/audio/xiang-an.mp3

      # 不用 npx：在含 package-lock.json 的目录里 npx 会把包嫁接进项目树，
      # runner 的 npm 会触发 Arborist 的 edgesOut 空指针（2026-09 起稳定复现）。
      # 全局安装走独立树，绕开该 bug。
      - name: Install EdgeOne CLI
        run: npm install --global edgeone@1.6.28

      - name: Deploy to EdgeOne
        run: edgeone makers deploy site --name gongkao-teacher-website --env production --area global --token "$EDGEONE_PAGES_API_TOKEN" --json
