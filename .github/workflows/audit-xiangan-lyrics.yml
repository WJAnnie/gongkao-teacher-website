name: Audit Xiangan Lyrics

on:
  push:
    paths:
      - '.github/workflows/audit-xiangan-lyrics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact audio
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -H 'Referer: https://suno.com/' \
            'https://cdn1.suno.ai/9699b383-feba-4acb-80af-38c15fe7dfd8.mp3' \
            -o xiangan.mp3
          ls -lh xiangan.mp3
          python - <<'PY'
          import os
          print('bytes=', os.path.getsize('xiangan.mp3'))
          PY

      - name: Install ffmpeg and inspect duration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 xiangan.mp3 | tee duration.txt

      - name: Try Suno public clip and native aligned lyrics
        continue-on-error: true
        run: |
          set +e
          curl -L -sS -D clip-headers.txt \
            'https://studio-api.prod.suno.com/api/clip/9699b383-feba-4acb-80af-38c15fe7dfd8' \
            -o clip.json
          curl -L -sS -D aligned-headers.txt \
            'https://studio-api.prod.suno.com/api/gen/9699b383-feba-4acb-80af-38c15fe7dfd8/aligned_lyrics/v2/' \
            -o aligned-lyrics.json
          echo '--- clip status/body ---'
          head -n 1 clip-headers.txt || true
          head -c 3000 clip.json || true
          echo
          echo '--- aligned status/body ---'
          head -n 1 aligned-headers.txt || true
          head -c 5000 aligned-lyrics.json || true
          echo

      - name: Upload audit files
        uses: actions/upload-artifact@v4
        with:
          name: xiangan-audit
          if-no-files-found: error
          path: |
            xiangan.mp3
            duration.txt
            clip-headers.txt
            clip.json
            aligned-headers.txt
            aligned-lyrics.json
          retention-days: 1
