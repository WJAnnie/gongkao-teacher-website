name: Audit Xiangan Lyrics

on:
  push:
    paths:
      - '.github/workflows/audit-xiangan-lyrics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download exact audio
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -H 'Referer: https://suno.com/' \
            'https://cdn1.suno.ai/9699b383-feba-4acb-80af-38c15fe7dfd8.mp3' \
            -o xiangan.mp3

      - name: Prepare character-spaced lyric transcript
        run: |
          cat > lyrics.txt <<'LYRICS'
          清晨的灯还亮在窗
          桌上的书翻过几章
          行测的题做了又想
          申论的字写了又改几行
          有时候路显得很长
          有时候心也会迷茫
          可昨天不会替你登场
          今天的你还要继续向前闯
          一道题，一页纸，一段时光
          一点点，把未知变成日常
          别急着问还有多远的地方
          先把今天走得坦荡
          乘一程云帆，向心中的岸启航
          穿过几阵风，也穿过几场迷茫
          行测练判断，申论写下主张
          一笔一画，都在靠近梦想
          乘一程云帆，朝想去的地方
          不用比谁快，也不用四处张望
          今天坐书桌，明天走进考场
          走过的每一步，终会有回响
          资料分析算到天亮
          判断推理绕过几场
          有些答案曾经勉强
          后来才懂方法比答案更长
          申论不是辞藻漂亮
          也不是模板写满纸张
          读懂材料理清思想
          才能让每一句话都有分量
          一道题，一次错，一次成长
          一次次，把慌张变成平常
          那些没人知道的晚上
          都在替未来积攒力量
          乘一程云帆，向心中的岸启航
          穿过几阵风，也穿过几场迷茫
          行测练判断，申论写下主张
          一笔一画，都在靠近梦想
          乘一程云帆，朝想去的地方
          不用比谁快，也不用四处张望
          今天坐书桌，明天走进考场
          走过的每一步，终会有回响
          是遇到难题，不再慌张
          是面对材料，学会判断
          是一次次想清楚以后
          再写下自己的主张
          有人陪你看过几页文章
          有人提醒你别急着找答案
          云起的时候，帆自然会扬
          剩下的路，要由你自己去闯
          乘一程云帆，向心中的岸启航
          走过这段路，也走过年少时光
          行测有方法，申论自有文章
          提笔的时候，心里已有方向
          乘一程云帆，朝想去的地方
          等有一天，你真的站在人群中央
          回头看那些，伏案许久的晚上
          你会发现，坚持早已经有了模样
          LYRICS
          sed -i 's/^          //' lyrics.txt
          python - <<'PY'
          from pathlib import Path
          import unicodedata
          lines=Path('lyrics.txt').read_text(encoding='utf-8').splitlines()
          clean=[]
          for line in lines:
              chars=[c for c in line.strip() if c.strip() and not unicodedata.category(c).startswith('P')]
              clean.append(' '.join(chars))
          Path('lyrics-char-spaced.txt').write_text('\n'.join(clean),encoding='utf-8')
          PY

      - name: Install aligner and ffmpeg binary
        run: |
          python -m pip install --upgrade pip
          python -m pip install stable-ts imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg, os
          src=imageio_ffmpeg.get_ffmpeg_exe()
          dst=os.path.expanduser('~/.local/bin/ffmpeg')
          os.makedirs(os.path.dirname(dst), exist_ok=True)
          if os.path.lexists(dst): os.remove(dst)
          os.symlink(src,dst)
          PY

      - name: Force-align with independent base model
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python - <<'PY'
          import json
          from pathlib import Path
          import stable_whisper
          lyrics=Path('lyrics-char-spaced.txt').read_text(encoding='utf-8').strip()
          model=stable_whisper.load_model('base')
          result=model.align('xiangan.mp3',lyrics,language='zh',original_split=True,nonspeech_skip=None,remove_instant_words=False)
          if result is None: raise RuntimeError('alignment returned None')
          out=[]
          for si,seg in enumerate(result.segments):
              out.append({'segment':si,'start':seg.start,'end':seg.end,'text':seg.text,'words':[{'word':w.word,'start':w.start,'end':w.end,'probability':w.probability} for w in seg.words]})
          Path('aligned-char-base-readable.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          for row in out:
              print(f"LINE {row['segment']+1:02d} {row['start']:.3f}-{row['end']:.3f}")
              print('  '+' | '.join(f"{w['word']}@{w['start']:.3f}-{w['end']:.3f}" for w in row['words']))
          PY

      - name: Upload alignment files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangan-char-base-alignment
          if-no-files-found: warn
          path: |
            lyrics.txt
            lyrics-char-spaced.txt
            aligned-char-base-readable.json
          retention-days: 1
